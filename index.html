<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#817b39">
  <title>ΣΤΑΤΗΡ | Ελληνικά Προϊόντα Διατροφής</title>
  <meta name="description" content="ΣΤΑΤΗΡ — Ελληνικά προϊόντα διατροφής.">
  <style>
    :root{
      --sand:#c4bb7d;
      --sand-light:#d2ca91;
      --olive:#817b39;
      --olive-dark:#676329;
      --ink:#17170f;
      --cream:#f5f1d9;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--sand);color:var(--ink)}
    body{
      min-height:100vh;
      font-family:Georgia,"Times New Roman",serif;
      overflow:hidden;
    }

    body::before,body::after{
      content:"";
      position:fixed;
      left:0;right:0;
      height:28px;
      background:var(--olive);
      z-index:2;
    }
    body::before{top:0}
    body::after{bottom:0}

    .page{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:72px 24px;
      position:relative;
      isolation:isolate;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.18), transparent 38%),
        linear-gradient(135deg, var(--sand-light), var(--sand));
    }

    .olive-art{
      position:absolute;
      width:360px;
      height:360px;
      opacity:.11;
      z-index:-1;
      color:var(--olive-dark);
    }
    .olive-art.left{left:-80px;bottom:15px;transform:rotate(-12deg)}
    .olive-art.right{right:-80px;bottom:15px;transform:scaleX(-1) rotate(-12deg)}

    main{
      width:min(760px,100%);
      text-align:center;
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      margin-bottom:30px;
    }

    .mark{
      width:86px;
      height:86px;
      display:grid;
      place-items:center;
      color:var(--olive-dark);
      flex:0 0 auto;
    }
    .mark svg{width:100%;height:100%}

    .wordmark{
      margin:0;
      font-size:clamp(3.2rem,8vw,6.4rem);
      line-height:.9;
      font-weight:400;
      letter-spacing:.035em;
      color:#11110c;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:20px;
      width:min(680px,92%);
      margin:0 auto 24px;
      color:var(--olive-dark);
    }
    .divider::before,.divider::after{
      content:"";
      height:1px;
      background:currentColor;
      flex:1;
      opacity:.75;
    }
    .divider svg{width:34px;height:34px}

    .tagline{
      margin:0 0 64px;
      font-family:Arial,Helvetica,sans-serif;
      font-size:clamp(.76rem,1.8vw,1rem);
      letter-spacing:.42em;
      text-transform:uppercase;
      color:#4f4c26;
    }

    .contact{
      display:grid;
      gap:18px;
      width:max-content;
      max-width:100%;
      margin:auto;
      text-align:left;
      font-family:Arial,Helvetica,sans-serif;
    }
    .contact a{
      display:flex;
      align-items:center;
      gap:18px;
      color:#292817;
      text-decoration:none;
      font-size:clamp(1rem,2.4vw,1.35rem);
      transition:opacity .2s ease;
    }
    .contact a:hover{opacity:.7}
    .icon{
      width:48px;height:48px;border-radius:50%;
      display:grid;place-items:center;
      background:var(--olive);
      color:var(--cream);
      flex:0 0 auto;
    }
    .icon svg{width:22px;height:22px}

    @media (max-width:600px){
      body{overflow:auto}
      .brand{gap:10px}
      .mark{width:58px;height:58px}
      .tagline{letter-spacing:.22em;margin-bottom:48px}
      .olive-art{width:250px;height:250px}
      .contact{width:100%;max-width:330px}
    }
  </style>
</head>
<body>
  <div class="page">
    <svg class="olive-art left" viewBox="0 0 300 300" aria-hidden="true">

        <path d="M108 182c30-4 53 5 69 27-29 10-53 5-73-14"/>
        <path d="M136 129c25-2 44 7 56 27-25 7-45 2-60-16"/>
        <ellipse cx="47" cy="250" rx="11" ry="22" transform="rotate(-35 47 250)"/>
        <ellipse cx="71" cy="263" rx="10" ry="21" transform="rotate(-25 71 263)"/>

    <svg class="olive-art right" viewBox="0 0 300 300" aria-hidden="true">

        <path d="M91 176c-28-13-44-35-48-65 33 5 54 22 62 51"/>
        <path d="M120 119c-23-10-37-27-42-51 27 3 45 16 54 39"/>

        <path d="M108 182c30-4 53 5 69 27-29 10-53 5-73-14"/>
        <path d="M136 129c25-2 44 7 56 27-25 7-45 2-60-16"/>
        <ellipse cx="47" cy="250" rx="11" ry="22" transform="rotate(-35 47 250)"/>
        <ellipse cx="71" cy="263" rx="10" ry="21" transform="rotate(-25 71 263)"/>

    <main>
      <div class="brand">

      <div class="divider" aria-hidden="true">

    </main>
  </div>
</body>
</html>
